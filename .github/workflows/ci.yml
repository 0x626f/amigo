name: Native builds and packages

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Linux software-center metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install metadata validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
      - name: Validate software-center metadata and packaging helpers
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          import distribute
          distribute.write_appstream(Path('/tmp/io.github.0x626f.amigo.metainfo.xml'))
          PY
          appstreamcli validate --no-net /tmp/io.github.0x626f.amigo.metainfo.xml
          desktop-file-validate packaging/amigo.desktop
          python -B scripts/dev.py test-recipes

  native:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            arch: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: aarch64
    env:
      CARGO_TERM_COLOR: always
      # Skip debug symbols for the short-lived CI checks to reduce compile/link time.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      AMIGO_MAINTAINER: "0x626f <0x626f@users.noreply.github.com>"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Linux dependencies and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev xdg-utils xdg-desktop-portal desktop-file-utils binutils rpm dpkg
          curl --fail --location --retry 3 "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage" --output "$RUNNER_TEMP/linuxdeploy"
          chmod +x "$RUNNER_TEMP/linuxdeploy"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          $expectedHash = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne $expectedHash) { throw 'Inno Setup download checksum mismatch' }
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }

      - name: Install stable Rust and check components
        run: |
          rustup toolchain install stable-${{ matrix.target }} --profile minimal --component rustfmt --component clippy
          rustup default stable-${{ matrix.target }}
          rustc -vV

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Formatting, lint, workspace tests, and packaging tests
        run: python -B scripts/dev.py check

      - name: Compile native screenshot examples
        run: cargo check --locked --examples

      - name: Build all native packages
        run: python -B scripts/dev.py dist

      - name: Verify RPM installation on Fedora
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD/dist:/packages:ro" \
            registry.fedoraproject.org/fedora:44 bash -euc '
              dnf -y --setopt=install_weak_deps=False install /packages/*/linux/*/*.rpm
              rpm -q amigo
              rpm -V amigo
            '

      - name: Record checksums and source commit
        run: python -B scripts/distribute.py prepare

      - uses: actions/upload-artifact@v7
        with:
          name: amigo-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*/${{ matrix.platform }}/${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 14
